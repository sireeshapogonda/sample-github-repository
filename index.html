
<!DOCTYPE html>
<html>
<head>
    <title>My Beautiful Family</title>

    <style>
        body {
            background-color: #fff0f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #c2185b;
        }

        .family {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 15px #ccc;
        }

        img {
            width: 100%;
            border-radius: 15px;
        }

        p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="family">

        <h1>My Beautiful Family ❤️</h1>

        <img
        src="family-photo.jpg"
        alt="Mother, Father and their three daughters">

        <h2>Our Happy Family</h2>

        <p>
            A loving mother, a caring father,
            and their three beautiful daughters.
        </p>

        <p>Five Hearts, One Family ❤️</p>

    </div>

</body>
</html>
